name: Bug report
description: A report generator doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out real ChatGPT exports, extracted transcripts, snippets of real conversations, generated reports and stats JSON, screenshots of private reports, private paths and personal data, also from logs. A small synthetic export that shows the problem helps most.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran (`chatgpt-wrapped-report` or `chatgpt-wrapped-all-time`) and a small synthetic export, or the JSON shape that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python version, operating system, browser if the problem is in the HTML, and anything else that matters here.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
