name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile extract_chatgpt_markdown.py generate_report.py generate_wrapped.py
      - run: python -m pytest
      - name: Run the documented synthetic examples
        run: |
          chatgpt-wrapped-report examples/synthetic-export --output-dir output/example-report --timezone UTC
          chatgpt-wrapped-all-time examples/synthetic-export --output-dir output/example-wrapped --timezone UTC
